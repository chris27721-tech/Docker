version: '1.2'

services:
  db:
    image: mysql:latest
    container_name: mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${LBSV_DB_VEREIN_ROOT}
      MYSQL_DATABASE: 'vereinsverwaltung'
      MYSQL_USER: 'lbsvverein'
      MYSQL_PASSWORD: ${LBSV_DB_VEREIN_USER}


    volumes:
      - ./mysql_data:/var/lib/mysql

    networks:
      verein-net:
        aliases:
          - db
          
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    networks:
      - verein-net

  wordpress-db:
    image: mysql:latest
    container_name: wordpress-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${LBSV_DB_WP_USER}
      MYSQL_ROOT_PASSWORD: ${LBSV_DB_WP_ROOT}

    volumes:
      - wordpress_db:/var/lib/mysql

    networks:
      wordpress-net:
        aliases:
          - wordpress-db    


  wordpress:
    image: wordpress:latest
    container_name: wordpress
    restart: unless-stopped

    depends_on:
      - wordpress-db

    ports:
      - "8080:80"

    environment:
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${LBSV_DB_WP_ROOT}

    volumes:
      - wordpress_data:/var/www/html

    networks:
      - wordpress-net
      
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin

      # Öffentliche IP oder DNS-Name deines Servers
      - SERVERURL=imlgviu4so8fljpz.myfritz.net

      # Öffentlicher WireGuard UDP-Port
      - SERVERPORT=51820

      # Clients automatisch erzeugen
      - PEERS=client01

      # DNS für VPN-Clients
      - PEERDNS=1.1.1.1

      # VPN-Netzwerk
      - INTERNAL_SUBNET=172.13.13.0

      # Full-Tunnel:
      # kompletter Client-Traffic geht durch VPN
      - ALLOWEDIPS=0.0.0.0/0

      # Client-Konfigurationen im Log/QR-Code anzeigen
      - LOG_CONFS=true

    volumes:
      - wireguard_config:/config
      - /lib/modules:/lib/modules:ro

    ports:
      - "51820:51820/udp"

    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1

    networks:
      bridge:
        ipv4_address: 172.17.0.10
      verein-net:
        ipv4_address: 172.18.0.10
      monitor-net:
        ipv4_address: 172.19.0.10
      wordpress-net:
        ipv4_address: 172.20.0.10
      wireguard-net:
        ipv4_address: 172.21.0.10

networks:
  verein-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
  monitor-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
  wordpress-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
  wireguard-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1

volumes:
  wordpress_db:
  wordpress_data:
  wireguard_config:
