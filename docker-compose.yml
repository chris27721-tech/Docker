version: '1.1'

services:
  db:
    image: mysql:latest
    container_name: mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: 'TWcjTkJsiM559cQabQVY'
      MYSQL_DATABASE: 'vereinsverwaltung'
      MYSQL_USER: 'lbsvverein'
      MYSQL_PASSWORD: 'e3myowpVubzWkt4jZdL9'

    volumes:
      - ./mysql_data:/var/lib/mysql

    networks:
      verein-net:
        aliases:
          - db
          
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80"
    networks:
      - verein-net
networks:
  verein-net:
    driver: bridge
