version: '1.2'

services:
  db:
    image: mysql:latest
    container_name: mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${LBSV_DB_VEREIN_ROOT}
      MYSQL_DATABASE: 'vereinsverwaltung'
      MYSQL_USER: 'lbsvverein'
      MYSQL_PASSWORD: ${LBSV_DB_VEREIN_USER}


    volumes:
      - ./mysql_data:/var/lib/mysql

    networks:
      verein-net:
        aliases:
          - db
          
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    networks:
      - verein-net

  wordpress-db:
    image: mysql:latest
    container_name: wordpress-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${LBSV_DB_WP_USER}
      MYSQL_ROOT_PASSWORD: ${LBSV_DB_WP_ROOT}

    volumes:
      - wordpress_db:/var/lib/mysql

    networks:
      wordpress-network:
        aliases:
          - wordpress-db    


  wordpress:
    image: wordpress:latest
    container_name: wordpress
    restart: unless-stopped

    depends_on:
      - wordpress-db

    ports:
      - "8080:80"

    environment:
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${LBSV_DB_WP_ROOT}

    volumes:
      - wordpress_data:/var/www/html

    networks:
      - wordpress-network

networks:
  verein-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
  monitor-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
  wordpress-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

volumes:
  wordpress_db:
  wordpress_data:
